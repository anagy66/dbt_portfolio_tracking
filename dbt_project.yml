name: dbt_portfolio_tracking

profile: dbt_portfolio_tracking

seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into 'raw'
  dbt_portfolio_tracking:
    +schema: raw
    raw_security_info:
      +post_hook: 
        - "update {{ this }} set load_ts = '{{ run_started_at }}' where load_ts is null"
      +column_types:
        load_ts: timestamp

snapshots:
  dbt_portfolio_tracking:
    +schema: snsh

models:
  dbt_portfolio_tracking:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +schema: stg
      +materialized: ephemeral
    refined:
      +schema: ref
      +materialized: table
    marts:
      +schema: mrt
      +materialized: table
