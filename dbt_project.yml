name: dbt_portfolio_tracking

profile: dbt_portfolio_tracking

seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into 'raw'
  dbt_portfolio_tracking:
    +schema: raw

snapshots:
  dbt_portfolio_tracking:
    +schema: snsh

models:
  dbt_portfolio_tracking:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +schema: stg
      +materialized: ephemeral
    refined:
      +schema: ref
      +materialized: table
    marts:
      +schema: mrt
      +materialized: table
