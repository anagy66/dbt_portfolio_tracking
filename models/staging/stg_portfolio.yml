models:
  - name: stg_portfolio
    description: Portfolio tracking records.
    config:
      contract:
        enforced: true
    columns:
      - name: position_hkey
        description: The unique identifier for each position in the portfolio.
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: position_hdiff
        description: The difference in positions.
        data_type: varchar
        data_tests:
          - not_null
      - name: account_code
        description: The account associated to the portfolio.
        data_type: varchar
        data_tests:
          - not_null
      - name: security_code
        description: The unique identifier for each stock symbol.
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: security_name
        description: A brief description of the stock symbol.
        data_type: varchar
      - name: exchange_code
        description: The exchange where the stock is listed.
        data_type: varchar
        data_tests:
          - not_null
      - name: report_date
        description: The date for which the portfolio report is generated.
        data_type: date
        data_tests:
          - not_null
      - name: quantity
        description: The number of shares held for the stock symbol.
        data_type: integer
        data_tests:
          - not_null
      - name: cost_base
        description: The cost basis for the stock symbol.
        data_type: numeric(12, 2)
        data_tests:
          - not_null
      - name: position_value
        description: The total value of the position.
        data_type: numeric(12, 2)
        data_tests:
          - not_null
      - name: currency_code
        description: The currency in which the position value is denominated.
        data_type: varchar
        data_tests:
          - not_null
      - name: record_source
        description: The source from which the portfolio record was obtained.
        data_type: varchar
        data_tests:
          - not_null
      - name: load_ts_utc
        description: The timestamp when the record was loaded into the system (in UTC).
        data_type: timestamp
        data_tests:
          - not_null
